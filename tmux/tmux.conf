#--------------------------------------------------------------------
# Appearance
#--------------------------------------------------------------------

# Modern tmux terminfo. Enables italics, undercurl, OSC-52, etc.
set -g default-terminal "tmux-256color"

# No terminal-overrides line for truecolor. tmux 3.2+ reads the outer
# terminal's terminfo, and xterm-ghostty declares Tc. Verify with:
#   tmux display -p '#{client_termfeatures}'   -> should list RGB

# Mouse on
set -g mouse on

# How long messages stay on screen, in milliseconds.
set -g display-time 2000

# Solid rather than single-line pane dividers.
set -g pane-border-lines heavy

#--------------------------------------------------------------------
# Prefix settings
#--------------------------------------------------------------------

# Reassign prefix key to Ctrl + A
unbind-key C-b
set -g prefix C-a

# Pressing binding twice sends it out of tmux
bind C-a send-prefix

#--------------------------------------------------------------------
# Behavior
#--------------------------------------------------------------------

# Windows/panes start at 1, renumber on close
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# Auto-rename window by active pane
setw -g automatic-rename on

# No delay on escape (matters for vim/nvim)
set -sg escape-time 0

# Size panes to the smallest client actually looking at that window, rather
# than the smallest client attached to the session.
setw -g aggressive-resize on

# Readline-style editing at the command prompt, even though copy mode is vi.
set -g status-keys emacs

# Non-login interactive shell for new panes.
# Skips /etc/zprofile, which calls path_helper (~500ms per pane).
# The tmux server inherits the full login env; panes only need .zshenv + .zshrc.
set -g default-command "${SHELL}"

# Extended keys: let modifier combos (Ctrl-Shift-*, Ctrl-i vs Tab, etc.)
# pass through to applications like Neovim.
set -s extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# Let programs inside a pane talk to Ghostty directly. Without this tmux eats
# OSC 9 and OSC 777, so desktop notifications from a long-running agent never
# arrive. Pairs with bell-features in ghostty/config.
set -g allow-passthrough on

# Bigger scrollback. Ghostty's own buffer is useless under tmux, so this is
# the only history that matters.
set -g history-limit 50000

# Let nvim see FocusGained/FocusLost
set -g focus-events on

# When the last session is destroyed, switch to another instead of detaching
set -g detach-on-destroy off

# Prompt for a window name on capital C
bind-key C command-prompt -p "Name of new window: " "new-window -n '%%'"

# Move current window left/right
bind-key -r '<' swap-window -d -t -1
bind-key -r '>' swap-window -d -t +1

# Toggle between the two most recent windows
bind-key a last-window

#--------------------------------------------------------------------
# Status bar
#--------------------------------------------------------------------
#
# Selenized, written with palette indices rather than hex. colour0-colour15
# resolve against the terminal's live palette, so this bar follows Ghostty's
# light/dark switch with no tmux-side configuration and no toggle key.
#
#   colour0  near-background    colour4  blue
#   colour3  yellow             colour6  cyan
#   colour7  foreground         colour8  muted
#
# Measured contrast (light / dark): bar text 4.65/5.03, session segment
# 3.77/3.25, active window 2.67/4.75, activity 2.58/4.94. The sub-3:1 values
# are all light mode and get lifted by minimum-contrast in ghostty/config.

# Refresh interval
set -g status-interval 5

set -g status-style 'bg=colour0,fg=colour7'
set -g status-left-length 40
set -g status-right-length 80

# Left: session name in a blue segment, angled separator
set -g status-left '#[bg=colour4,fg=colour0,bold] #S #[bg=colour0,fg=colour4]▶ '

# Window list separator
set -g window-status-separator '#[fg=colour8]│'

# Inactive windows are dimmed. Flags are intentionally omitted — activity is
# signaled by color, the current window by weight and hue.
set -g window-status-format '#[fg=colour8] #I:#W '

# Active window: cyan
set -g window-status-current-format '#[fg=colour6,bold] #I:#W #[default]'

# Activity highlight: yellow
setw -g monitor-activity on
set -g visual-activity off
setw -g window-status-activity-style 'fg=colour3,bg=colour0,none'

# Right: date muted, time at full weight. Selenized has no third background
# shade, so there is no separate clock segment here.
set -g status-right '#[fg=colour8]%d %b #[fg=colour7]%H:%M '

# Borders, prompts, and the copy-mode selection
set -g pane-border-style        'fg=colour0'
set -g pane-active-border-style 'fg=colour6'
set -g message-style         'bg=colour4,fg=colour0'
set -g message-command-style 'bg=colour4,fg=colour0'
set -g mode-style            'bg=colour6,fg=colour0'

#--------------------------------------------------------------------
# Copy/Paste
#--------------------------------------------------------------------

# Route copies through OSC 52 to the terminal, which hands them to the system
# clipboard. Unlike pbcopy this also works when tmux is running on a remote
# host. Ghostty advertises `clipboard` in client_termfeatures.
set -g set-clipboard on

# Use vim keybindings in copy mode
setw -g mode-keys vi

# Setup mouse drag to copy and exit copy-mode
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# Setup 'v' to begin selection as in Vim
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# Update default binding of `Enter` to also use copy-pipe
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel

# Double and triple click selections
bind-key -T root DoubleClick1Pane if-shell -Ft'{mouse}' '#{alternate_on}' "send-keys -M" "copy-mode -t'{mouse}'; send-keys -t'{mouse}' -X select-word"
bind-key -T root TripleClick1Pane if-shell -Ft'{mouse}' '#{alternate_on}' "send-keys -M" "copy-mode -t'{mouse}'; send-keys -t'{mouse}' -X select-line"

# Ctrl+click to open URLs
bind-key -T root C-MouseUp1Pane {
  copy-mode -M
  send-keys -X select-word
  send-keys -X copy-pipe-and-cancel "xargs open"
}

#--------------------------------------------------------------------
# Shortcuts
#--------------------------------------------------------------------

# Reloads the conf file after changes
bind r source-file ~/.config/tmux/tmux.conf \; display "Tmux config reloaded!"

bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Make <prefix> x kill current panel without asking
unbind x
bind x kill-pane

# Make <prefix> X kill current session
bind X kill-session

#--------------------------------------------------------------------
# Popups
#--------------------------------------------------------------------
#
# A popup is an overlay window drawn on top of the current pane. It does not
# change the pane layout, and closing it leaves no trace. -E closes it when
# the command exits.

# Scratch shell in the current directory. Run something, read the output,
# press exit. Nothing is resized and no pane is left behind.
bind e display-popup -E -w 80% -h 80% -d "#{pane_current_path}"

#--------------------------------------------------------------------
# Panes handling
#--------------------------------------------------------------------

# Pane switching with vim awareness is provided by christoomey/vim-tmux-navigator.
# The plugin handles Ctrl-h/j/k/l/\\ both in tmux and inside (n)vim.

# Resize panels vith vim movement keys instead of arrows
# Fine adjustment (1 or 2 cursor cells per bump)
bind-key -r k resize-pane -U 1
bind-key -r l resize-pane -R 2
bind-key -r j resize-pane -D 1
bind-key -r h resize-pane -L 2
# Coarse adjustment (5 or 10 cursor cells per bump)
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 10
bind-key -r J resize-pane -D 5
bind-key -r H resize-pane -L 10

# keep the focus on current window and send the pane
# to a secondary window
bind-key b break-pane -d

# Restore clear-screen as prefix + Ctrl-l (vim-tmux-navigator hijacks bare Ctrl-l)
bind C-l send-keys 'C-l'

#--------------------------------------------------------------------
# Plugins (TPM)
#--------------------------------------------------------------------
#
# tmux-sensible is deliberately absent. Of the nine options it sets, seven are
# set explicitly above. It also injects reattach-to-user-namespace as
# default-command on macOS, which has been unnecessary since 10.14.

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect: capture pane contents and restore programs that were running.
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh psql mysql sqlite3 "~claude->claude *" "~claude" node npm pnpm yarn vim nvim less more man tail watch htop btop'
set -g @resurrect-strategy-nvim 'session'

# Continuum: auto-save every 5 minutes, auto-restore on tmux server start.
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'

# Initialize TMux Plugin Manager (must be the last thing in this file)
run -b ~/.config/tmux/plugins/tpm/tpm
